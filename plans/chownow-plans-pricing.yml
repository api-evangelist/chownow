  - Restaurant Technology
  - Commission Free
  - Subscription
description: >-
  ChowNow prices its restaurant ordering platform as a flat-fee software
  subscription rather than per-order commission. Three subscription tiers
  (Launch, Grow, Elevate) are offered with annual and monthly billing options
  that differ by included marketing contact slots and email/SMS credits while
  sharing the same core ordering, marketing, operations, fraud protection, POS
  integration, and 24/7 support feature set. A one-time setup fee, a flat
  per-order transaction fee (2.95% + $0.29), an optional Apple developer fee for
  branded mobile apps, optional printer equipment, and a per-order Flex Delivery
  fee are layered on top of the subscription. ChowNow does not publish a public
  developer API, so these plans describe the commercial restaurant SaaS offering
  rather than API metering. Prices reflect the public pricing page and may vary
  by promotion and region.
sources:
  - https://get.chownow.com/pricing/
  - https://get.chownow.com/products/
