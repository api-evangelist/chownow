aid: chownow
name: ChowNow
description: >-
  ChowNow is a Playa Vista, Los Angeles-based restaurant technology company
  providing commission-free online ordering, branded mobile apps, marketing
  tools, and operational software purpose-built for independent restaurants.
  Founded in 2011, ChowNow powers ordering websites, native iOS/Android apps,
  QR-code dine-in ordering, catering, email and SMS marketing, a rewards
  program, Flex Delivery, order aggregation, and centralized menu management
  for 20,000+ restaurants. The platform integrates with 20+ point-of-sale
  systems including Toast, Square, Revel, Clover, Lightspeed, Heartland Genius,
  Skytab, and PosiTouch, and syndicates restaurant menus through a Discovery
  Network spanning Google, Apple Maps, Yelp, and other channels, with optional
  hand-off to DoorDash, UberEats, and Grubhub for last-mile delivery. ChowNow's
  business model is flat-fee software-as-a-service for restaurants rather than
  per-order commissions, and the company does not publish a public developer
  API, SDK, OpenAPI specification, webhooks reference, or open developer portal.
  Third-party integration is handled through pre-built connectors managed inside
  the restaurant dashboard and a private partnerships program; prospective POS,
  delivery, and technology partners apply through a partnerships form rather than
  self-serve API documentation. The company's public GitHub presence consists
  primarily of forks of open-source Python/JavaScript tooling and archived
  internal libraries, with no SDK, client library, or specification repositories.
